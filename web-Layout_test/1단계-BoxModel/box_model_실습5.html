<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box_model_실습5</title>
    <style>
        /* 웹페이지 초기화 */
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            margin: 0px;
            padding: 30px;
        }

        /* div 박스 공통 스타일 */
        /* class명은 두 개 이상 적용 가능 class="별칭1 별칭2 */
        div.box{
            width: 375px;
            height: 100px;
            color: black;
            font-size: 16px;
            text-align: center;
            line-height: 60px;
            margin: 20px auto;
            /* border: 1px solid black; */
        }
        div.box1{
            background-color: #3498db;
            padding: 10px;
            border: 2px solid #1a5276;
        }
        div.box2{
            background-color: #e74c3c;
            padding: 20px;
            border: 4px solid #1922b2;
        }
        div.box3{
            background-color: #2ecc71;
            padding: 30px;
            border: 6px solid #1e8449;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">📦Box Model 종합실습</h2>
    <div class="box box1">padding: 10px / border: 2px solid </div>
    <div class="box box2">padding: 20px / border: 4px solid</div>
    <div class="box box3">padding: 30px / border: 6px solid</div>
</body>
</html>
