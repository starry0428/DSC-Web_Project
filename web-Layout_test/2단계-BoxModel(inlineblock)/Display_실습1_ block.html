<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 실습1-block</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            margin: 0px;
            padding: 20px;
        }
        div.block-box{
            background-color: #3498db;
            color: white;
            padding: 10px;
            margin-bottom: 5px;

            /* width: 300px;
            height: 50px;
            text-align: center;
            line-height: 25px; */
        }
        div.b1{
            width: 300px;
            height: 50px;
            border: 10px;
            text-align: center;
            line-height: 50px;
        }
        div.b2{
            width: 400px;
            height: 100px;
            border: 50px;
            text-align: center;
            line-height: 100px;
        }
        div.b3{
            width: 500px;
            height: 150px;
            border: 150px;
            text-align: center;
            line-height: 150px;}
    </style>
</head>
<body>
    <h2>block 요소 확인</h2>

    <div class="block-box b1">div 태그 - block</div>
    <div class="block-box b2">div 태그 - block</div>
    <div class="block-box b3">div 태그 - block</div>
</body>
</html>
