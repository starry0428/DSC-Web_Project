<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 실습3-inline-block</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        div.inline-block-box{
            background-color: #2ecc71;
            color: white;

            padding: 100px;
            margin: 5px;

            width: 300px;
            height: 80px;
            text-align: center;
            line-height: 80px;

            /* display: "inline-block" 설정한다. 1번, 2번 반복해서 적용 연습*/
            display: inline-block;

            /* display: "block" 설정한다. */
            /* display: block; */
        }
    </style>
</head>
<body>
    <h2>inline-block 요소(태그) 확인</h2>
    <div class="inline-block-box">박스1</div>
    <div class="inline-block-box">박스2</div>
    <div class="inline-block-box">박스3</div>

</body>
</html>
