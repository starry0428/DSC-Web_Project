<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 실습4-none</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        div.box-visible{
            background-color: #349bdb;
            color: white;
            padding: 10px;
            margin: 5px;
        }
        div.box-none{
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            margin: 5px;

            /* display: "none" 번갈아가면서 적용해봅니다. */
            /* display: "block" 번갈아가면서 적용해봅니다. */
            display: block;
        }
        div.box-hidden{
            background-color: #9b59bd;
            color: white;
            padding: 10px;
            margin: 5px;

            /* visibility: "hidden" 번갈아가면서 적용해봅니다. */
            /* visibility: "visible" 번갈아가면서 적용해봅니다. */
            visibility: hidden;
        }
        
    </style>
</head>
<body>
    <div class="box-visible">① 보이는 박스</div>
    <div class="box-none">② Display: "none" → 완전히 사라짐</div>
    <div class="box-hidden">③ visibility: "hidden" → 공간만 남음</div>
    <div class="box-visible">④ 보이는 박스</div>

</body>
</html>
